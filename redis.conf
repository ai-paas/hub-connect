# Redis configuration for Hub Connect Tus uploads
# Optimized for upload state management

# Basic settings
bind 0.0.0.0
port 6379
timeout 300
tcp-keepalive 60

# Memory management
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Persistence settings
# Enable AOF for better durability of upload states
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Disable RDB snapshots (AOF is sufficient for our use case)
save ""

# Security
protected-mode no  # Disabled for Docker internal network
requirepass ""     # No password in Docker environment

# Logging
loglevel notice
logfile ""         # Log to stdout for Docker

# Client settings
tcp-backlog 511
databases 16

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Performance tuning for Tus workload
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog settings
hll-sparse-max-bytes 3000

# Active rehashing
activerehashing yes

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Client query buffer limit
client-query-buffer-limit 1gb

# Protocol buffer limit
proto-max-bulk-len 512mb

# Frequency of rehashing the main dictionary
hz 10

# Enable dynamic HZ
dynamic-hz yes

# AOF settings optimized for upload state
aof-rewrite-incremental-fsync yes
aof-load-truncated yes
aof-use-rdb-preamble yes

# RDB settings (disabled but configured for emergency use)
rdbcompression yes
rdbchecksum yes
rdb-del-sync-files no

# TLS disabled (using internal Docker network)
tls-port 0

# Module settings
loadmodule-queue-limit 10000