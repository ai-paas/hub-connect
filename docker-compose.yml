services:
  hub-connect-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hub-connect-api
    restart: unless-stopped
    
    # Port mapping
    ports:
      - "8001:8001"
    
    # Environment file
    env_file:
      - .env
    
    # Volume mounts
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./.env:/app/.env:ro
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"