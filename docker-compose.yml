version: '3.8'

services:
  # Redis service for Tus upload state management
  redis:
    image: redis:7-alpine
    container_name: hub-connect-redis
    restart: unless-stopped
    
    # Redis configuration
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --timeout 300
      --tcp-keepalive 60
    
    # Volumes for data persistence
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    
    # Health check
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    
    # Security
    user: "999:999"
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 600m
          cpus: '0.5'
        reservations:
          memory: 256m
          cpus: '0.1'

  # Main API service
  hub-connect-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hub-connect-api
    restart: unless-stopped
    
    # Depend on Redis being healthy
    depends_on:
      redis:
        condition: service_healthy
    
    # Use bridge network instead of host for Redis connectivity
    networks:
      - hub-connect-network
    
    # Expose port explicitly when not using host network
    ports:
      - "8001:8001"
    
    # Environment file
    env_file:
      - .env
    
    # Override Redis connection for Docker environment
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
    
    # Volume mounts
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./.env:/app/.env:ro
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2.0'
        reservations:
          memory: 512m
          cpus: '0.5'

# Networks
networks:
  hub-connect-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Volumes
volumes:
  redis_data:
    driver: local